<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>金尚 JINSHANG × WTL DESIGN · 公司介绍</title>
<style>
:root{
  --stage:#14110d;        /* 深暖墨：舞台底色/letterbox */
  --paper:#8d877c;        /* 暖灰纸 */
  --ivory:#ece6da;        /* 米白 */
  --gold:#c6a877;         /* 哑光金 */
  --goldsoft:#b89c6e;
  --dim:#9a9286;          /* 次级文字 */
  --line:rgba(198,168,119,.42);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--stage);color:var(--ivory);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  -webkit-font-smoothing:antialiased}
.serif{font-family:"Songti SC","SimSun","Source Han Serif SC",STSong,"Times New Roman",serif}
#app{position:relative;width:100vw;height:100vh;overflow:hidden}

/* ===== 影像层（可选背景图：双层交叉淡入 + 缓慢推近）===== */
#film{position:absolute;inset:0;background:var(--stage);z-index:0}
.layer{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;
  opacity:0;transition:opacity 1.15s ease;will-change:opacity,transform}
.layer.on{opacity:1}
.layer.has.kb{animation:kenburns var(--dur,9s) linear forwards}
@keyframes kenburns{from{transform:scale(1.005)}to{transform:scale(1.05)}}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:2;
  background:
   linear-gradient(180deg,rgba(8,6,4,.55) 0%,rgba(8,6,4,0) 20%,rgba(8,6,4,0) 66%,rgba(8,6,4,.78) 100%),
   radial-gradient(120% 120% at 50% 45%,rgba(0,0,0,0) 58%,rgba(0,0,0,.5) 100%)}

/* ===== 页眉 ===== */
#topbar{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;justify-content:space-between;align-items:center;
  padding:2.6vh 4vw 0;font-size:11px;letter-spacing:.28em}
#wordmark{display:flex;align-items:baseline;gap:.7em;color:var(--gold)}
#wordmark b{font-weight:600;letter-spacing:.42em;font-size:13px}
#wordmark span{color:var(--dim);font-size:9.5px;letter-spacing:.34em}
#sectionlab{color:var(--ivory);opacity:.86;text-transform:uppercase;font-size:10.5px}
#sectionlab em{font-style:normal;color:var(--gold);margin-right:.7em;letter-spacing:.2em}
#topline{position:absolute;top:6.6vh;left:4vw;right:4vw;height:1px;background:var(--line);z-index:6;
  transform-origin:left;transform:scaleX(0);transition:transform 1.1s .2s ease}
#app.ready #topline{transform:scaleX(1)}

/* ===== 内容层 ===== */
#content{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
  padding:13vh 7vw 13vh;opacity:0;transform:translateY(16px);
  transition:opacity .6s ease,transform .6s ease}
#content.show{opacity:1;transform:none}
.slide{width:100%;max-width:1140px}

.eyebrow{display:flex;align-items:center;gap:.9em;margin-bottom:3.4vh;font-size:11px;letter-spacing:.34em;text-transform:uppercase}
.eyebrow .mk{width:34px;height:1px;background:var(--gold);opacity:.85}
.eyebrow i{font-style:normal;color:var(--ivory);font-size:12px;letter-spacing:.28em}
.eyebrow em{font-style:normal;color:var(--dim);letter-spacing:.36em;font-size:10px}

/* 封面 */
.cover{text-align:center}
.cover .kick{color:var(--gold);letter-spacing:.5em;font-size:11px;text-transform:uppercase;margin-bottom:5vh}
.cover .name{font-size:clamp(40px,7vw,92px);font-weight:300;letter-spacing:.14em;color:var(--ivory);line-height:1.1}
.cover .partner{margin-top:1.4vh;color:var(--gold);letter-spacing:.4em;font-size:clamp(13px,1.6vw,18px)}
.cover .rule{width:60px;height:1px;background:var(--line);margin:5vh auto}
.cover .tzh{font-size:clamp(16px,2vw,24px);letter-spacing:.12em;color:var(--ivory)}
.cover .ten{margin-top:1.3vh;color:var(--dim);letter-spacing:.4em;font-size:10.5px;text-transform:uppercase}

/* 关于 / 陈述 */
.stmt .lead{font-size:clamp(20px,2.4vw,30px);color:var(--gold);letter-spacing:.1em;margin-bottom:2.6vh}
.stmt .body{font-size:clamp(21px,2.9vw,40px);font-weight:300;line-height:1.5;color:var(--ivory);letter-spacing:.03em;max-width:20em}
.stmt .meta{margin-top:5.2vh;color:var(--dim);font-size:13px;letter-spacing:.14em}

/* 理念 / 引言 */
.quote .qzh{font-size:clamp(26px,4.4vw,60px);font-weight:300;line-height:1.45;color:var(--ivory);letter-spacing:.04em;max-width:16em}
.quote .qen{margin-top:4vh;color:var(--gold);letter-spacing:.32em;font-size:clamp(10px,1.1vw,13px);text-transform:uppercase;line-height:1.9;max-width:44em}

/* 专长网格 */
.grid .items{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.grid .cell{background:var(--stage);padding:5.4vh 2vw;text-align:center}
.grid .cell .t{font-size:clamp(19px,2.3vw,30px);font-weight:300;color:var(--ivory);letter-spacing:.14em}
.grid .cell .d{margin-top:1.4vh;color:var(--dim);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase}

/* 作品 */
.works .projects{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.works .card{position:relative;aspect-ratio:4/3;border:1px solid var(--line);overflow:hidden;
  background:#1c1811;display:flex;flex-direction:column;justify-content:flex-end;padding:16px}
.works .card .ph{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
.works .card:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 42%,rgba(8,6,4,.86))}
.works .card .idx{position:absolute;top:11px;left:13px;z-index:3;color:var(--gold);font-size:10px;letter-spacing:.2em;opacity:.65}
.works .card .txt{position:relative;z-index:3}
.works .card .name{color:var(--ivory);font-size:clamp(14px,1.5vw,18px);letter-spacing:.06em}
.works .card .loc{margin-top:.55em;color:var(--gold);font-size:10px;letter-spacing:.24em;text-transform:uppercase}

/* 数字与荣誉 */
.stats .row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.stats .stat{background:var(--stage);padding:5.4vh 1vw;text-align:center}
.stats .stat .n{font-size:clamp(30px,4.6vw,62px);font-weight:300;color:var(--gold);letter-spacing:.02em;line-height:1}
.stats .stat .n em{font-style:normal;font-size:.42em;color:var(--goldsoft);margin-left:.08em}
.stats .stat .l{margin-top:1.6vh;color:var(--dim);font-size:10px;letter-spacing:.22em;text-transform:uppercase;line-height:1.6}
.stats .awards{margin-top:4.4vh;display:flex;flex-wrap:wrap;gap:12px 30px;justify-content:center}
.stats .awards span{color:var(--ivory);font-size:13px;letter-spacing:.1em;padding-left:16px;position:relative}
.stats .awards span:before{content:'';position:absolute;left:0;top:50%;width:6px;height:1px;background:var(--gold)}

/* 客户 */
.clients .names{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.clients .names span{background:var(--stage);padding:4.6vh 1vw;text-align:center;color:var(--ivory);
  font-size:clamp(14px,1.6vw,19px);letter-spacing:.14em;display:flex;align-items:center;justify-content:center;min-height:0}

/* 联系 */
.contact .big{font-size:clamp(24px,3.6vw,48px);font-weight:300;color:var(--ivory);letter-spacing:.04em;margin-bottom:5.4vh}
.contact .rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2.6vh 4vw;max-width:840px}
.contact .r{border-top:1px solid var(--line);padding-top:1.5vh}
.contact .r .k{color:var(--gold);font-size:10px;letter-spacing:.3em;text-transform:uppercase}
.contact .r .v{margin-top:.8vh;color:var(--ivory);font-size:clamp(15px,1.8vw,21px);letter-spacing:.06em}

/* ===== 章节闪幕 ===== */
#chap{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(20,17,13,.92);opacity:0;visibility:hidden;transition:opacity .8s,visibility .8s;pointer-events:none}
#chap.on{opacity:1;visibility:visible}
#chap .ck{width:42px;height:1px;background:var(--gold);margin-bottom:28px;opacity:0;transition:.8s .1s}
#chap .czh{font-size:clamp(34px,5.4vw,68px);font-weight:300;letter-spacing:.3em;color:var(--ivory);
  opacity:0;transform:translateY(18px);transition:.8s .2s}
#chap .cen{margin-top:18px;font-size:clamp(10px,1.1vw,13px);letter-spacing:.5em;color:var(--gold);text-transform:uppercase;
  opacity:0;transform:translateY(14px);transition:.8s .34s}
#chap.on .ck{opacity:.9;width:72px}
#chap.on .czh,#chap.on .cen{opacity:1;transform:none}

/* ===== 进度条 + 页码 ===== */
#progwrap{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:7;background:rgba(255,255,255,.08)}
#prog{height:100%;width:0;background:linear-gradient(90deg,var(--goldsoft),var(--gold));transition:width .9s ease}
#ticks{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:7;pointer-events:none}
#ticks i{position:absolute;top:0;width:1px;height:3px;background:rgba(255,255,255,.35)}
#pageno{position:absolute;right:4vw;bottom:3.4vh;z-index:7;font-size:11px;letter-spacing:.2em;color:var(--dim)}
#pageno b{color:var(--ivory);font-weight:500}

/* ===== 控制 / 提示 ===== */
#ctrl{position:absolute;bottom:3vh;left:50%;transform:translateX(-50%);display:flex;gap:9px;z-index:9}
#ctrl button{background:rgba(20,17,13,.5);border:1px solid var(--line);color:var(--ivory);
  font-family:inherit;font-size:11.5px;padding:7px 16px;border-radius:30px;cursor:pointer;letter-spacing:.12em;
  backdrop-filter:blur(4px);transition:.25s}
#ctrl button:hover{background:rgba(198,168,119,.22);border-color:var(--gold)}
#ctrl button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#hint{position:absolute;bottom:3.6vh;left:4vw;z-index:7;font-size:10px;color:rgba(154,146,134,.7);letter-spacing:.16em}

/* ===== 编辑模式 ===== */
.editmode [data-path]{cursor:text}
.editmode [data-path]:hover{outline:1px dashed rgba(198,168,119,.5);outline-offset:3px}
[contenteditable]:focus{outline:1px solid var(--gold);outline-offset:3px}
.editmode #film{cursor:pointer}
.editmode .works .card .ph{cursor:pointer;box-shadow:inset 0 0 0 1px rgba(198,168,119,.35)}
#filePick{display:none}

@media(max-width:820px){
  .grid .items,.stats .row,.clients .names{grid-template-columns:repeat(2,1fr)}
  .works .projects{grid-template-columns:repeat(2,1fr)}
  .contact .rows{grid-template-columns:1fr}
}
@media(max-width:520px){
  .works .projects{grid-template-columns:1fr}
}
</style>
</head>
<body>

    <div id="wordmark"><b>金尚 JINSHANG</b><span>× WTL DESIGN</span></div>

</div>

<script>
let cur=0, playing=false, timer=null, chapTimer=null, frontIsA=true, editing=false, seq=0;
const $=q=>document.querySelector(q);
const app=$('#app'), layA=$('#layA'), layB=$('#layB'), film=$('#film');
const contentEl=$('#content'), chap=$('#chap'), filePick=$('#filePick');

const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function setPath(o,p,v){
  const ks=p.split('.'); let x=o;
  for(let i=0;i<ks.length-1;i++){ let k=ks[i]; x=x[/^\d+$/.test(k)?+k:k]; }
  let last=ks[ks.length-1]; x[/^\d+$/.test(last)?+last:last]=v;
}

function eb(s){
  return `<div class="eyebrow"><span class="mk"></span><i data-path="ez">${esc(s.ez)}</i><em data-path="ee">${esc(s.ee)}</em></div>`;
}

function render(s){
  switch(s.type){
    case 'cover': return `<div class="slide cover">
      <div class="kick" data-path="kicker">${esc(s.kicker)}</div>
      <div class="name serif" data-path="name">${esc(s.name)}</div>
      <div class="partner" data-path="partner">${esc(s.partner)}</div>
      <div class="rule"></div>
      <div class="tzh serif" data-path="tzh">${esc(s.tzh)}</div>
      <div class="ten" data-path="ten">${esc(s.ten)}</div></div>`;
    case 'statement': return `<div class="slide stmt">${eb(s)}
      <div class="lead serif" data-path="lead">${esc(s.lead)}</div>
      <div class="body" data-path="body">${esc(s.body)}</div>
      <div class="meta" data-path="meta">${esc(s.meta)}</div></div>`;
    case 'quote': return `<div class="slide quote">${eb(s)}
      <div class="qzh serif" data-path="qzh">${esc(s.qzh)}</div>
      <div class="qen" data-path="qen">${esc(s.qen)}</div></div>`;
    case 'grid': return `<div class="slide grid">${eb(s)}
      <div class="items">${s.items.map((it,i)=>`<div class="cell"><div class="t serif" data-path="items.${i}.t">${esc(it.t)}</div><div class="d" data-path="items.${i}.d">${esc(it.d)}</div></div>`).join('')}</div></div>`;
    case 'works': return `<div class="slide works">${eb(s)}
      <div class="projects">${s.projects.map((p,i)=>`<div class="card"><div class="ph" data-img="projects.${i}.img" style="${p.img?`background-image:url('${p.img}')`:''}"></div><div class="idx">${String(i+1).padStart(2,'0')}</div><div class="txt"><div class="name" data-path="projects.${i}.name">${esc(p.name)}</div><div class="loc" data-path="projects.${i}.loc">${esc(p.loc)}</div></div></div>`).join('')}</div></div>`;
    case 'stats': return `<div class="slide stats">${eb(s)}
      <div class="row">${s.stats.map((st,i)=>`<div class="stat"><div class="n serif"><span data-path="stats.${i}.n">${esc(st.n)}</span><em data-path="stats.${i}.u">${esc(st.u)}</em></div><div class="l" data-path="stats.${i}.l">${esc(st.l)}</div></div>`).join('')}</div>
      <div class="awards">${s.awards.map((a,i)=>`<span data-path="awards.${i}">${esc(a)}</span>`).join('')}</div></div>`;
    case 'clients': return `<div class="slide clients">${eb(s)}
      <div class="names">${s.names.map((n,i)=>`<span data-path="names.${i}">${esc(n)}</span>`).join('')}</div></div>`;
    case 'contact': return `<div class="slide contact">${eb(s)}
      <div class="big serif" data-path="big">${esc(s.big)}</div>
      <div class="rows">${s.rows.map((r,i)=>`<div class="r"><div class="k" data-path="rows.${i}.k">${esc(r.k)}</div><div class="v" data-path="rows.${i}.v">${esc(r.v)}</div></div>`).join('')}</div></div>`;
  }
  return '';
}

function applyBg(s){
  const front=frontIsA?layA:layB, back=frontIsA?layB:layA;
  front.style.backgroundImage=s.img?`url("${s.img}")`:'none';
  front.classList.toggle('has',!!s.img);
  front.classList.remove('kb'); void front.offsetWidth;
  front.classList.add('on'); if(s.img)front.classList.add('kb');
  back.classList.remove('on');
  frontIsA=!frontIsA;
}

function flash(s){
  chap.querySelector('.czh').textContent=s.chap;
  chap.querySelector('.cen').textContent=s.chapEn;
  chap.classList.add('on');
  clearTimeout(chapTimer);
  chapTimer=setTimeout(()=>chap.classList.remove('on'),950);
}

function enableEdit(){
  contentEl.querySelectorAll('[data-path]').forEach(e=>{e.setAttribute('contenteditable','true');e.spellcheck=false;});
}

function go(i){
  if(i<0||i>=scenes.length) return;
  cur=i; const s=scenes[i]; const my=++seq;
  applyBg(s);
  $('#sectionlab').innerHTML='<em>'+esc(s.chap)+'</em>'+esc(s.chapEn);
  $('#pageno').innerHTML='<b>'+String(i+1).padStart(2,'0')+'</b> / '+String(scenes.length).padStart(2,'0');
  $('#prog').style.width=(i/(scenes.length-1)*100)+'%';
  contentEl.classList.remove('show');
  setTimeout(()=>{ if(my!==seq)return; contentEl.innerHTML=render(s); if(editing)enableEdit(); contentEl.classList.add('show'); },300);
  if(s.newChap) flash(s);
  if(playing){
    clearTimeout(timer);
    if(i+1<scenes.length) timer=setTimeout(()=>go(i+1), s.dur+(s.newChap?900:0));
    else setPlaying(false);
  }
}

function setPlaying(p){
  playing=p; $('#btnPlay').textContent=p?'❚❚ 暂停':'▶ 自动播放';
  clearTimeout(timer);
  if(p){ const s=scenes[cur]; if(cur+1<scenes.length) timer=setTimeout(()=>go(cur+1), s.dur+(s.newChap?900:0)); else setPlaying(false); }
}

function toggleEdit(){
  editing=!editing; app.classList.toggle('editmode',editing);
  if(editing){ setPlaying(false); enableEdit(); }
  else contentEl.querySelectorAll('[data-path]').forEach(e=>e.removeAttribute('contenteditable'));
  $('#btnEdit').textContent=editing?'✓ 完成编辑':'✎ 编辑';
}

// 编辑：文字实时写回数据模型
contentEl.addEventListener('input',e=>{
  if(!editing)return;
  const t=e.target.closest('[data-path]');
  if(t) setPath(scenes[cur], t.dataset.path, t.textContent);
});

// 编辑：作品卡片换图
contentEl.addEventListener('click',e=>{
  if(!editing)return;
  const ph=e.target.closest('[data-img]');
  if(!ph)return;
  pickImage(u=>{ setPath(scenes[cur], ph.dataset.img, u); contentEl.innerHTML=render(scenes[cur]); enableEdit(); });
});

// 编辑：整幕背景换图
film.addEventListener('click',()=>{
  if(!editing)return;
  pickImage(u=>{ scenes[cur].img=u; applyBg(scenes[cur]); });
});

function pickImage(cb){
  filePick.value='';
  filePick.onchange=()=>{ const f=filePick.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>cb(r.result); r.readAsDataURL(f); };
  filePick.click();
}

function exportHTML(){
  const clone=document.documentElement.cloneNode(true);
  clone.querySelector('#scenesData').textContent='\nconst scenes='+JSON.stringify(scenes)+';\n';
  clone.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));
  const ap=clone.querySelector('#app'); if(ap)ap.classList.remove('editmode','ready');
  const html='<!DOCTYPE html>\n'+clone.outerHTML;
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='金尚JINSHANG_公司介绍.html';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

// 控制
$('#btnPrev').onclick=()=>go(cur-1);
$('#btnNext').onclick=()=>go(cur+1);
$('#btnPlay').onclick=()=>setPlaying(!playing);
$('#btnEdit').onclick=toggleEdit;
$('#btnExport').onclick=exportHTML;

document.addEventListener('keydown',e=>{
  if(editing && e.target.isContentEditable && e.key!=='Escape')return;
  if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); if(e.key===' ')setPlaying(!playing); else go(cur+1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); go(cur-1); }
  else if(e.key==='e'||e.key==='E'){ toggleEdit(); }
  else if(e.key==='Escape'&&editing){ toggleEdit(); }
});

// 章节刻度
(function(){ const t=$('#ticks');
  scenes.forEach((s,i)=>{ if(s.newChap && i>0){ const el=document.createElement('i');
    el.style.left=(i/(scenes.length-1)*100)+'%'; t.appendChild(el);} });
})();

app.classList.add('ready');
go(0);
</script>
</body>
</html>
