<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">

</head>
<body>
<div class="row">

  <div class="sw"><div class="chip" style="background:var(--paper-2)"></div><div class="nm">paper-2</div><div class="hex">#EBE7DF</div></div>

  <div class="sw"><div class="chip" style="background:var(--rule)"></div><div class="nm">rule</div><div class="hex">#D8D4CC</div></div>

</html>
